<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0">
  <meta name="description" content="Streams IMU sensor data to a relay server">
  <title>IMU Stream</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 12px;
    }
    #code {
      font-size: 48px;
      letter-spacing: 4px;
      font-weight: bold;
    }
    #status {
      font-size: 14px;
      color: #888;
    }
    #hz {
      font-size: 12px;
      color: #555;
    }
    #imu-box {
      margin-top: 20px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      line-height: 1.8;
      width: 220px;
      color: #aaa;
    }
    #imu-box span { color: #fff; font-weight: bold; }
  </style>
</head>
<body>
  <div id="code">----</div>
  <div id="status">connecting...</div>
  <div id="hz"></div>
  <div id="imu-box">
    <div>ax <span id="v-ax">—</span>  ay <span id="v-ay">—</span>  az <span id="v-az">—</span></div>
    <div>gr <span id="v-gr">—</span>  gp <span id="v-gp">—</span>  gy <span id="v-gy">—</span></div>
    <div>interval <span id="v-interval">—</span> ms</div>
  </div>
  <script src="imu.js"></script>
</body>
</html>
